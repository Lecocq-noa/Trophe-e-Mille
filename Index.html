<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard concours</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e9e7;--card:#f6f6f4;--ink:#2b2f2e;--mute:#7a817e;--line:#d2d5d2;--run:#2b2f2e;--done:#1f9d6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1e1d;--card:#262928;--ink:#e4e6e4;--mute:#8b928f;--line:#373b3a;--run:#e4e6e4;--done:#5fd6a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1e1d;--card:#262928;--ink:#e4e6e4;--mute:#8b928f;--line:#373b3a;--run:#e4e6e4;--done:#5fd6a0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
#board{position:fixed;inset:0}
.top{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:600}
.card{position:absolute;width:168px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden;user-select:none}
.card.run{border-color:var(--run)}
.card.done{border-color:var(--done);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--done) 35%,transparent)}}
@keyframes boing{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
.grip{display:flex;align-items:center;gap:0;padding:7px 4px 2px 9px;cursor:grab;touch-action:none}
.grip:active{cursor:grabbing}
.name{flex:1;font-weight:600;font-size:14px;line-height:1.15;min-width:0;min-height:32px;display:flex;align-items:center;overflow-wrap:anywhere}
.name.empty{color:var(--mute);font-weight:400}
.ib{background:none;border:0;color:var(--mute);padding:2px 4px;font-size:12px}
.ib:hover,.ib:focus-visible{color:var(--ink)}
.time{position:relative;padding:0 9px 3px;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.run .time{color:var(--run)}.done .time{color:var(--done)}
.bell{display:none;position:absolute;right:6px;top:-18px;font-size:16px}
.done .bell{display:block;animation:boing .7s ease-in-out infinite}
.bar{height:4px;background:var(--line);margin:0 9px;border-radius:2px;overflow:hidden}
